<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="PikaCap is a pixel-art yellow mascot in a red cap."
    />
    <title>PikaCap</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="PikaCap showcase">
      <section class="hero">
        <div class="copy">
          <p class="eyebrow">Pixel mascot drop</p>
          <h1>PikaCap</h1>
          <p class="summary">
            A bright, game-ready mascot with a red cap, crisp pixel edges, and
            just enough electric attitude for the whole screen.
          </p>
          <a class="button" href="./assets/pikacap-spritesheet.webp" download>
            Download spritesheet
          </a>
        </div>

        <figure class="sprite">
          <img
            src="./assets/pikacap-spritesheet.webp"
            alt="PikaCap pixel-art mascot spritesheet"
          />
        </figure>
      </section>
    </main>
  </body>
</html>
